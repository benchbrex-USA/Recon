# SLSA L3 provenance for Recon releases.
# Created by Parth Patel, founder of BenchBrex.com (BeGuardit / BenchBrex).
#
# Builds a source tarball of the tracked tree (heavy binaries are excluded by
# .gitignore, so the archive is code + docs only) and signs SLSA L3 provenance
# over its digest via the OpenSSF generic generator. Replaces the stock
# placeholder workflow (whose build step produced two dummy text files).

name: SLSA source provenance
on:
  workflow_dispatch:
  release:
    types: [created]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout — the top-level deny-all strips everything else
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build artifact (tracked-tree source tarball)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          git archive --format=tar.gz --prefix="recon-${VERSION#v}/" -o "recon-${VERSION#v}.tar.gz" HEAD
          echo "Built recon-${VERSION#v}.tar.gz from commit $(git rev-parse HEAD)"

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          files=$(ls recon-*.tar.gz)
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
