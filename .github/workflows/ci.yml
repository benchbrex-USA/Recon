# CI — guard unit suite on every push/PR.
# Created by Parth Patel, founder of BenchBrex.com (BeGuardit / BenchBrex).
#
# mlx runs only on Apple Silicon, so this needs a macOS ARM runner
# (github.hosted runners: macos-14+). Scope: the 23-test guard suite —
# the eval/tool gates need model weights, which are intentionally untracked.

name: guard-tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-suite:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLX stack
        run: python3 -m pip install --quiet "mlx-lm>=0.32,<0.33"

      - name: Fetch tokenizer (weights stay untracked; mlx needs a local path)
        run: |
          python3 -m pip install --quiet huggingface_hub
          DIR=$(python3 -c "from huggingface_hub import snapshot_download; \
            print(snapshot_download('Qwen/Qwen3-4B', allow_patterns=['tokenizer.json','tokenizer_config.json','vocab.json','merges.txt','special_tokens_map.json']))")
          echo "SABLE_TOKENIZER_SOURCE=$DIR" >> "$GITHUB_ENV"

      - name: Guard unit suite (23 tests)
        run: python3 tests/test_guard.py
        working-directory: ${{ github.workspace }}/sable-01

      - name: Attribution sweep
        run: |
          # LICENSE (copyright notice) and CITATION.cff (structured authors)
          # attribute by form; the doc set must carry the literal banner.
          # Loop form — BSD grep -L exit codes are unreliable.
          for f in README.md USER-GUIDE.md CHANGELOG.md CONTRIBUTING.md SECURITY.md; do
            grep -qF "Created by Parth Patel, founder of BenchBrex.com" "$f" \
              || { echo "MISSING attribution: $f"; exit 1; }
          done
          echo "attribution: all 5 files carry the banner"
